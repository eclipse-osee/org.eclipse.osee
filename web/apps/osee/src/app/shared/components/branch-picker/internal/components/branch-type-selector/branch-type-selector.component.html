<mat-button-toggle-group
	[value]="branchType"
	(change)="selectType($event)"
	hideSingleSelectionIndicator
	class="tw-w-full [--mat-button-toggle-height:32px] [--mat-button-toggle-label-text-size:13px] [--mat-button-toggle-selected-state-background-color:var(--osee-primary-default)] [--mat-button-toggle-selected-state-text-color:var(--osee-background-background)] [--mat-button-toggle-shape:4px] [--mat-button-toggle-text-color:var(--osee-foreground-secondary-text)]"
	aria-label="Branch type">
	<mat-button-toggle
		value="baseline"
		data-cy="baseline"
		class="tw-flex-1">
		Baseline
	</mat-button-toggle>
	<mat-button-toggle
		value="working"
		data-cy="working"
		class="tw-flex-1">
		Working
	</mat-button-toggle>
</mat-button-toggle-group>
