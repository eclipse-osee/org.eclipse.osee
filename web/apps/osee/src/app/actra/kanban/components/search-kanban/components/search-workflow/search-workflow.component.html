<mat-form-field
	appearance="outline"
	subscriptSizing="dynamic">
	<mat-label>Workflow</mat-label>
	<mat-select
		multiple
		[value]="selectedWorkflowIds()"
		(selectionChange)="selectedWorkflowIds.set($event.value)">
		@for (option of options(); track option.id) {
			<mat-option [value]="option.id">{{ option.name }}</mat-option>
		} @empty {
			<mat-option disabled>No options available</mat-option>
		}
	</mat-select>
</mat-form-field>
@if (selectedWorkflowIds().length > 0) {
	<button
		mat-stroked-button
		type="button"
		(click)="selectedWorkflowIds.set([])">
		Clear
	</button>
}
