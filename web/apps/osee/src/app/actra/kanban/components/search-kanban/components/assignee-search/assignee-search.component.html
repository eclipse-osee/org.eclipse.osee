<mat-form-field
	appearance="outline"
	subscriptSizing="dynamic">
	<mat-label>Assignees</mat-label>
	<mat-select
		multiple
		[value]="selectedAssignees()"
		(selectionChange)="selectedAssignees.set($event.value)">
		@for (option of options(); track option) {
			<mat-option [value]="option">{{ option }}</mat-option>
		} @empty {
			<mat-option disabled>No options available</mat-option>
		}
	</mat-select>
</mat-form-field>
@if (selectedAssignees().length > 0) {
	<button
		mat-stroked-button
		type="button"
		(click)="selectedAssignees.set([])">
		Clear
	</button>
}
