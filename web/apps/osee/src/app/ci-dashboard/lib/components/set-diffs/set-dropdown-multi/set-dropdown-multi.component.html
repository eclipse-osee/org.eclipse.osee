@if (sets | async; as _sets) {
	<div class="tw-flex tw-w-full tw-flex-col tw-gap-4">
		<div class="tw-flex tw-h-8 tw-items-center">
			<mat-checkbox
				class="[--mat-checkbox-state-layer-size:32px]"
				matTooltip="Show only CI Sets marked Active in this list. Already selected Sets stay selected."
				[checked]="activeOnly()"
				(change)="setActiveOnly($event)"
				>Active sets only</mat-checkbox
			>
		</div>
		<mat-form-field
			class="tw-w-full"
			subscriptSizing="dynamic"
			appearance="outline">
			<mat-label>Select Sets to Compare</mat-label>
			<mat-select
				[ngModel]="selectedSets | async"
				(ngModelChange)="updateSets($event)"
				multiple
				[compareWith]="compareSets">
				@for (option of _sets; track option.id) {
					<mat-option [value]="option">
						{{ option.name.value }}
					</mat-option>
				}
			</mat-select>
		</mat-form-field>
	</div>
}
