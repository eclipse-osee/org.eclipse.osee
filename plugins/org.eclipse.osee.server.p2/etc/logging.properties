# Set global default
.level=WARNING

# Console handler filters
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=WARNING
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter

# CXF logging interceptors
org.apache.cxf.level=WARNING
org.apache.cxf.interceptor.LoggingInInterceptor.level=WARNING
org.apache.cxf.interceptor.LoggingOutInterceptor.level=WARNING

# Client-disconnect noise: CXF logs a full stack trace at WARNING when it can't send a response
# (e.g. the client closed the connection mid-download). Raise to SEVERE to suppress that.
org.apache.cxf.phase.PhaseInterceptorChain.level=SEVERE
