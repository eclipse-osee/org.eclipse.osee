# Log4j 1.x config for the embedded ActiveMQ broker (vm:// transport).
# Selected with -Dlog4j.configuration to replace the INFO-level config bundled inside
# activemq-all-5.14.0.jar, which prints broker start/stop banners to the console.
# Log4j 1.x does NOT honor -Dlog4j.logger.<name>=LEVEL system props, so the level is set here.

log4j.rootLogger=WARN, console
log4j.logger.org.apache.activemq=WARN
log4j.logger.org.springframework=WARN
log4j.logger.org.apache.xbean=WARN
log4j.logger.org.apache.camel=WARN
log4j.logger.org.eclipse.jetty=WARN

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%5p | %m%n
log4j.appender.console.threshold=WARN
